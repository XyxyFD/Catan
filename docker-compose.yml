services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: archipel
      POSTGRES_PASSWORD: archipel
      POSTGRES_DB: archipel
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archipel -d archipel"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://archipel:archipel@db:5432/archipel
      # Die vier Accounts: Name:Passwort, durch Komma getrennt. Hier anpassen!
      APP_USERS: "Felix:catan,Günther:catan,Kühlschrank:catan,Jonas:catan"
      # Nur dieser Account kann Spiele erstellen und die Karte bearbeiten
      MAP_EDITOR: "Felix"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
